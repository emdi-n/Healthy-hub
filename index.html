<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Healthy Hub</title>
  <meta name="theme-color" content="#eef2ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171e1a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Healthy Hub">
  <!-- A tiny leaf icon as the browser tab icon, so we don't need an image file -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23a3c19b'/%3E%3Cpath d='M18 46c0-16 10-26 28-28-1 18-9 28-24 28z' fill='%234c7a5c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The whole app is drawn into these three places by app.js -->
  <main id="app" aria-live="polite"></main>
  <nav id="nav" aria-label="Main"></nav>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript>Healthy Hub needs JavaScript switched on to run.</noscript>
  <script src="app.js"></script>
</body>
</html>

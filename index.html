<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Healthy Hub</title>
  <meta name="theme-color" content="#eef2ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171e1a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Healthy Hub">
  <!-- Browser tab icon -->
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icon-16.png">
  <!-- Home Screen icon on iPhone/iPad (this is what fixes the plain "H") -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The whole app is drawn into these three places by app.js -->
  <main id="app" aria-live="polite"></main>
  <nav id="nav" aria-label="Main"></nav>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript>Healthy Hub needs JavaScript switched on to run.</noscript>
  <script src="app.js"></script>
</body>
</html>
